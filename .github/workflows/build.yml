name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false
      release__duo_latest:
        description: Force publish duo-latest prerelease
        type: boolean
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    # Xcode 27 image ships iOS 27.1 SDK (iphoneos27.1) required for Duo fullscreen.
    runs-on: xcode-27
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: LiveContainer_duo_ios27.1.ipa
      artifact2: LiveContainer+SideStore_duo_ios27.1.ipa
      artifact_legacy: ${{ env.scheme }}.ipa
      artifact2_legacy: ${{ env.scheme }}+SideStore.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Show SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-build-version
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: |
          # Keep going after xcodebuild fails so we can dump real compiler errors
          # (Actions defaults to `bash -e`, which would exit at the pipe otherwise).
          set +e
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=16.1 \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '==== xcodebuild errors ===='
            grep -E 'error:|fatal error:|undefined' /tmp/xcodebuild.log | tail -80 || true
            echo '==== last 40 log lines ===='
            tail -40 /tmp/xcodebuild.log || true
          fi
          exit $status
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          chmod +x .github/build_github.sh .github/patch_duo_sdk.py
          sh .github/build_github.sh

      - name: Upload Duo IPAs
        uses: actions/upload-artifact@v7
        with:
          name: duo-ipas
          path: |
            LiveContainer_duo_ios27.1.ipa
            LiveContainer+SideStore_duo_ios27.1.ipa
            ${{ env.scheme }}.ipa
            ${{ env.scheme }}+SideStore.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download Duo IPAs
        uses: actions/download-artifact@v8
        with:
          name: duo-ipas
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            LiveContainer.ipa
            LiveContainer+SideStore.ipa
            .github/apps_nightly.json
      - name: Update apps.json in Release 1.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release__duo_latest:
    name: Publish duo-latest
    permissions:
      contents: write
    # Publish on main pushes, manual dispatch, and any PR merge into default branch workflow.
    if: |
      inputs.release__duo_latest ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/cursor/'))
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__duo_latest
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Duo IPAs
        uses: actions/download-artifact@v8
        with:
          name: duo-ipas
      - name: Verify artifacts
        run: |
          ls -lh LiveContainer_duo_ios27.1.ipa LiveContainer+SideStore_duo_ios27.1.ipa
      - name: Publish / overwrite duo-latest prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: duo-latest
          name: duo-latest (iPhone Duo / iOS 27.1)
          prerelease: true
          make_latest: false
          body: |
            Fixed direct-install links for iPhone Duo (`iPhone19,4`) / iOS 27.1:

            - https://github.com/${{ github.repository }}/releases/download/duo-latest/LiveContainer+SideStore_duo_ios27.1.ipa
            - https://github.com/${{ github.repository }}/releases/download/duo-latest/LiveContainer_duo_ios27.1.ipa

            **Commit:** ${{ github.sha }}
            **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Built with Xcode 27.1 / `iphoneos27.1` SDK. Host + SideStoreApp.framework + PlugIns stamped with `MinimumOSVersion=16.1`, `LC_BUILD_VERSION` `minos=16.1` / `sdk=27.1`, and modern `UILaunchScreen`.
          files: |
            LiveContainer_duo_ios27.1.ipa
            LiveContainer+SideStore_duo_ios27.1.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
